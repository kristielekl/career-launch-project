<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Login Page</title>

</head>
<body>
  <nav>
    <div class="navigation-headings">
      <h1><a href="index.html" class="navigation" id="titletext">CareerLaunch</a></h1>
      <h2><a href="index.html" class="navigation" id="maintext">Main Page</a></h2>

    </div>
  </nav>

  <div class="login-container">
    <h2>Login With An Existing Account</h2>
    <form action="/login" method="post">
      <div class="login-info">
        <label for="username">Username</label>
        <input type="text" id="usernameInput" name="username" placeholder="Enter Username" required>
      </div>
      <div class="login-info">
        <label for="password">Password</label>
        <input type="password" id="passwordInput" name="password" placeholder="Enter Password" required>
      </div>
      <button type="submit">Login</button>
    </form>
  </div>
  
</body>
</html>
