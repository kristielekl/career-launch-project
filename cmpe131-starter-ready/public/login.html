<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - CareerLaunch</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app">
  <nav class="side" aria-label="Main navigation">
    <a class="brand" href="index.html"><span class="mark"><span class="ico i-launch" aria-hidden="true"></span></span>CareerLaunch</a>
    <div class="tabs">
      <a class="nav-item" href="dashboard.html"><span class="ico i-grid" aria-hidden="true"></span><span>Dashboard</span></a>
      <a class="nav-item" href="timeline.html"><span class="ico i-timeline" aria-hidden="true"></span><span>Timeline</span></a>
      <a class="nav-item" href="questions.html"><span class="ico i-code" aria-hidden="true"></span><span>Question Map</span></a>
      <a class="nav-item" href="careerResources.html"><span class="ico i-book" aria-hidden="true"></span><span><span class="long">Career </span>Resources</span></a>
    </div>
    <a class="nav-item login-link" href="login.html" aria-current="page"><span class="ico i-login" aria-hidden="true"></span>Login</a>
    <label class="theme-choice"><span>Theme</span><select id="themeChoice" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </nav>
  <main class="content">
    <div class="login-wrap">
      <section class="card login" aria-labelledby="loginHeading">
        <span class="mark"><span class="ico i-launch" aria-hidden="true"></span></span>
        <h1 id="loginHeading">Try the CareerLaunch demo</h1>
        <p>No account or signup is needed. This demo uses one shared, simulated student.</p>
        <a class="btn btn-primary btn-block arrow-after i-arrow" href="dashboard.html">Continue to Demo</a>
        <p class="fine"><span class="ico i-info ico-sm" aria-hidden="true"></span><span>Anything you add, like goals or tasks, is visible to every visitor of this demo.</span></p>
      </section>
    </div>
  </main>
</body>
</html>
