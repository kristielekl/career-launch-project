<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Map - CareerLaunch</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/questions.js" defer></script>
</head>
<body class="app">
  <nav class="side" aria-label="Main navigation">
    <a class="brand" href="index.html"><span class="mark"><span class="ico i-launch" aria-hidden="true"></span></span>CareerLaunch</a>
    <div class="tabs">
      <a class="nav-item" href="dashboard.html"><span class="ico i-grid" aria-hidden="true"></span><span>Dashboard</span></a>
      <a class="nav-item" href="timeline.html"><span class="ico i-timeline" aria-hidden="true"></span><span>Timeline</span></a>
      <a class="nav-item" href="questions.html" aria-current="page"><span class="ico i-code" aria-hidden="true"></span><span>Question Map</span></a>
      <a class="nav-item" href="careerResources.html"><span class="ico i-book" aria-hidden="true"></span><span><span class="long">Career </span>Resources</span></a>
    </div>
    <a class="nav-item login-link" href="login.html"><span class="ico i-login" aria-hidden="true"></span>Login</a>
    <label class="theme-choice"><span>Theme</span><select id="themeChoice" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </nav>
  <main class="content">
    <div class="page-head"><div><h1>Question Map</h1>
      <p class="sub">Choose a question to practice on LeetCode. Links open in a new tab. Mark a question Completed to record your progress.</p></div></div>
    <div class="toolbar"><label class="lbl" for="topic">Topic</label><select id="topic" class="select"><option value="">All topics</option></select></div>
    <p id="message" class="msg msg-info" role="status">Loading questions…</p>
    <div id="questions" class="card qlist"></div>
  </main>
</body>
</html>
