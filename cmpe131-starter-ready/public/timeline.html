<body>
  <div class="navigation-headings">

      <a href="index.html" class="navigation" id="titletext">CareerLaunch</a>

    <h2>
      <a href="index.html" class="navigation" id="maintext">Main Page</a>

  <h2 id="timelineHeader">Timeline</h2>
  <hr>

  <!--Create Task Button Shows the Task Creation Menu-->
  <button id="taskCreationOpenButton">Create a Task</button>
  
  <div class="taskcreation-container">
    <form id="taskCreationForm" action="/add-task" method="post">
      <label for="taskTitle">Task Name:</label>
      <input type="text" id="taskTitle" name="taskTitle" placeholder="Enter Task Name" required>

      <label for="category">Category:</label>
      <input type="text" id="category" name="category" placeholder="Enter Category of Task" required>

      <label for="dueDate">Due Date:</label>
      <input type="date" id="dueDate" placeholder="01/01/2001" name="dueDate required">

      <label for="estimatedHours">Estimated Hours:</label>
      <input type="number" id="estimatedHours" name="estimatedHours" placeholder="Enter Estimated Hours" required>

      <label for="taskStatus">Status Progress (1-100%):</label>
      <input type="number" id="taskStatus" name="taskStatus" placeholder="Enter Status Progress" required>

      <button id="taskCreationCloseButton">Cancel</button>
      <button id="taskCreationSubmitButton" type="submit">Submit</button>
    </form>
  </div>

  <!-- Opening and Closing Create a Task Menu-->
  <script>
    // Opens "Create a Task" Menu
    document.getElementById("taskCreationOpenButton").addEventListener("click", function() {
      document.getElementById("taskCreationForm").style.display="block";
    });
    // Closes "Create a Task" Menu
    document.getElementById("taskCreationCloseButton").addEventListener("click", function() {
      document.getElementById("taskCreationForm").style.display="none";
    });
  </script>

  
</body>
</html>
