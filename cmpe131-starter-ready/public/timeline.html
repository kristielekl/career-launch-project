<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline - CareerLaunch</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app">
  <nav class="side" aria-label="Main navigation">
    <a class="brand" href="index.html"><span class="mark"><span class="ico i-launch" aria-hidden="true"></span></span>CareerLaunch</a>
    <div class="tabs">
      <a class="nav-item" href="dashboard.html"><span class="ico i-grid" aria-hidden="true"></span><span>Dashboard</span></a>
      <a class="nav-item" href="timeline.html" aria-current="page"><span class="ico i-timeline" aria-hidden="true"></span><span>Timeline</span></a>
      <a class="nav-item" href="questions.html"><span class="ico i-code" aria-hidden="true"></span><span>Question Map</span></a>
      <a class="nav-item" href="careerResources.html"><span class="ico i-book" aria-hidden="true"></span><span><span class="long">Career </span>Resources</span></a>
    </div>
    <a class="nav-item login-link" href="login.html"><span class="ico i-login" aria-hidden="true"></span>Login</a>
    <label class="theme-choice"><span>Theme</span><select id="themeChoice" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </nav>
  <main class="content">
    <div class="page-head">
      <div><h1 id="timelineHeader">Timeline</h1></div>
      <div class="actions"><button id="taskCreationOpenButton" type="button" class="btn btn-primary"><span class="ico i-plus ico-sm" aria-hidden="true"></span>Create task</button></div>
    </div>
    <div class="legend" aria-label="Status key"><span><span class="dot"></span>Planned</span><span><span class="dot dot-progress"></span>In progress</span><span><span class="dot dot-done"></span>Completed</span></div>

    <p id="taskError" role="alert"></p>
    <p id="taskEmpty" class="empty">Loading tasks…</p>
    <section id="timelineOverview" aria-label="Tasks by due date" hidden>
      <div id="taskTimeline"></div>
    </section>

    <dialog id="taskDialog" class="drawer" aria-labelledby="taskFormHeading">
      <form id="taskCreationForm" aria-labelledby="taskFormHeading" action="/api/tasks" method="post">
        <div class="drawer-head">
          <div><h2 id="taskFormHeading">Create a task</h2><p id="taskFormNote">New tasks start as Planned.</p></div>
          <button type="button" class="icon-btn" id="taskDialogClose" aria-label="Close"><span class="ico i-x" aria-hidden="true"></span></button>
        </div>
        <div class="drawer-body">
          <p id="taskFormError" role="alert"></p>
          <div class="field"><label for="taskTitle">Task name <span class="req">Required</span></label>
            <input type="text" class="input" id="taskTitle" name="taskTitle" placeholder="Enter task name" required></div>
          <div class="field"><label for="category">Category <span class="req">Required</span></label>
            <input type="text" class="input" id="category" name="category" placeholder="Resume, Coding, Interview prep…" required></div>
          <div class="two">
            <div class="field"><label for="dueDate">Due date <span class="req">Required</span></label>
              <input type="date" class="input" id="dueDate" name="dueDate" required></div>
            <div class="field"><label for="estimatedHours">Estimated hours <span class="req">Optional</span></label>
              <input type="number" class="input" id="estimatedHours" name="estimatedHours" placeholder="0–999" min="0" max="999" step="any" aria-describedby="hoursHelp">
              <span class="field-help" id="hoursHelp">Up to 999</span></div>
          </div>
          <div class="field" style="margin-bottom:0"><label for="description">Description <span class="req">Optional</span></label>
            <textarea class="textarea" id="description" name="description" placeholder="Notes for this task"></textarea></div>
        </div>
        <div class="drawer-foot">
          <button id="taskCreationCloseButton" type="button" class="btn btn-secondary">Cancel</button>
          <button id="taskCreationSubmitButton" type="submit" class="btn btn-primary">Create task</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog" class="confirm" role="alertdialog" aria-labelledby="deleteHeading" aria-describedby="deleteNote">
      <form method="dialog">
        <h2 id="deleteHeading"></h2>
        <p id="deleteNote">This permanently removes the task.</p>
        <div class="actions">
          <button type="submit" value="cancel" class="btn btn-secondary" autofocus>Cancel</button>
          <button type="submit" value="delete" class="btn btn-danger"><span class="ico i-trash ico-sm" aria-hidden="true"></span>Delete task</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="js/timeline.js"></script>
</body>
</html>
