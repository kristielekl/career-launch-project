<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline Page</title>
  <link rel ="stylesheet" href="css/styles.css"> <!--Style CSS for Style and Formatting-->
</head>
<body>
  <nav>
    <div class="navigation-headings">
      <h1><a href="index.html" class="navigation" id="titletext">CareerLaunch</a></h1>
      <h2><a href="dashboard.html" class="navigation" id="dashboardtext">Dashboard</a></h2>
      <h2><a href="timeline.html" class="navigation" id="navigationtext" aria-current="page">Timeline</a></h2>
      <h2><a href="questions.html" class="navigation">Question Map</a></h2>
      <h2><a href="careerResources.html" class="navigation">Career Resources</a></h2>
      <h2><a href="login.html" class="navigation" id="logintext">Login</a></h2>
    </div>
  </nav>

  <hr id="headerline">

  <h2 id="timelineHeader">Timeline</h2>
  <p>Plan your next steps and track your progress by due date.</p>

  <!--Create Task Button Shows the Task Creation Menu-->
  <button id="taskCreationOpenButton">Create a Task</button>
  
  <div class="taskcreation-container">
    <form id="taskCreationForm" aria-labelledby="taskFormHeading" action="/api/tasks" method="post">
      <h3 id="taskFormHeading">Create a task</h3>
      <label for="taskTitle">Task Name (required):</label>
      <input type="text" id="taskTitle" name="taskTitle" placeholder="Enter Task Name" required>

      <label for="category">Category (required):</label>
      <input type="text" id="category" name="category" placeholder="Enter Category of Task" required>

      <label for="dueDate">Due Date (required):</label>
      <input type="date" id="dueDate" name="dueDate" required>

      <label for="estimatedHours">Estimated Hours:</label>
      <input type="number" id="estimatedHours" name="estimatedHours" placeholder="Up to 999 hours" min="0" max="999" step="any">

      <label for="description">Description:</label>
      <textarea id="description" name="description"></textarea>
      <p>New tasks start as Planned.</p>

      <button id="taskCreationCloseButton" type="button">Cancel</button>
      <button id="taskCreationSubmitButton" type="submit">Submit</button>
    </form>
  </div>

  <p id="taskError" role="alert"></p>
  <p id="taskEmpty">Loading tasks…</p>
  <section id="timelineOverview" aria-labelledby="dueDateHeading" hidden>
    <h2 id="dueDateHeading">By due date</h2>
    <ol id="taskTimeline" class="task-timeline" aria-label="Tasks by due date"></ol>
  </section>
  <h2>All tasks</h2>
  <ul id="taskList" aria-label="Saved tasks"></ul>
  <script src="js/timeline.js"></script>
</body>
</html>
